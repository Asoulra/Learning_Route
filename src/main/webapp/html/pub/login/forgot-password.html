<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 - 学生成绩管理系统</title>
  <link rel="stylesheet" href="/css/pub/common.css">
  <style>
    .login-page {
      min-height: 100dvh;
      display: flex;
    }

    .login-left {
      flex: 1;
      background: linear-gradient(135deg, #1e293b 0%, #312e81 50%, #4338ca 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .login-left::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
      top: -150px;
      right: -100px;
      border-radius: 50%;
    }

    .login-left::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      bottom: -100px;
      left: -50px;
      border-radius: 50%;
    }

    .brand-content {
      text-align: center;
      color: white;
      position: relative;
      z-index: 1;
    }

    .brand-icon {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 36px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .brand-desc {
      font-size: 16px;
      color: rgba(255,255,255,0.65);
      max-width: 340px;
      line-height: 1.7;
      margin: 0 auto;
    }

    .login-right {
      width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #ffffff;
    }

    .login-form-container {
      width: 100%;
      max-width: 380px;
    }

    .login-form-header {
      margin-bottom: 36px;
    }

    .login-form-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--gray-900);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .login-form-header p {
      font-size: 15px;
      color: var(--gray-500);
    }

    .form-group-login {
      margin-bottom: 22px;
    }

    .form-input-login {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: 15px;
      outline: none;
      transition: all var(--transition-fast);
      background: var(--bg-secondary);
      box-sizing: border-box;
    }

    .form-input-login:focus {
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--primary-500);
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .tip-text {
      font-size: 12px;
      color: var(--gray-400);
      text-align: center;
      margin-top: 6px;
    }

    @media (max-width: 960px) {
      .login-left { display: none; }
      .login-right { width: 100%; }
    }

    @media (max-width: 480px) {
      .login-right { padding: 24px; }
      .brand-title { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <!-- 左侧品牌区 -->
    <div class="login-left">
      <div class="brand-content">
        <div class="brand-icon">SMS</div>
        <h2 class="brand-title">学生成绩管理系统</h2>
        <p class="brand-desc">高效、智能的教育数据管理平台，助力教学数字化转型</p>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="login-right">
      <div class="login-form-container">
        <div class="login-form-header">
          <h1>重置密码</h1>
          <p>请输入您的用户名并设置新密码</p>
        </div>

        <form id="resetForm" onsubmit="handleReset(event)">
          <div class="form-group-login">
            <label class="form-label">用户名</label>
            <input type="text" id="username" class="form-input-login" placeholder="请输入您的用户名" required>
          </div>

          <div class="form-group-login">
            <label class="form-label">新密码</label>
            <input type="password" id="newPassword" class="form-input-login" placeholder="请输入新密码（至少6位）" required minlength="6">
          </div>

          <div class="form-group-login">
            <label class="form-label">确认密码</label>
            <input type="password" id="confirmPassword" class="form-input-login" placeholder="请再次输入新密码" required minlength="6">
          </div>

          <button type="submit" class="btn btn-primary btn-login">确认重置</button>
        </form>

        <a href="login.html" class="back-link">&#8592; 返回登录</a>
        <p class="tip-text">重置成功后请使用新密码登录</p>
      </div>
    </div>
  </div>

  <script src="/js/pub/common.js"></script>
  <script>
    async function handleReset(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!username) {
        showToast('请输入用户名', 'warning');
        return;
      }

      if (newPassword.length < 6) {
        showToast('新密码长度不能少于6位', 'warning');
        return;
      }

      if (newPassword !== confirmPassword) {
        showToast('两次输入的密码不一致', 'warning');
        return;
      }

      try {
        const result = await apiRequest('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ username, newPassword, confirmPassword })
        });

        showToast('密码重置成功，即将跳转登录页', 'success');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);

      } catch (err) {
        // 错误已在 apiRequest 中处理
      }
    }
  </script>
</body>
</html>
