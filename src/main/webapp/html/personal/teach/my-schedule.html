<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的课表 - 学生成绩管理系统</title>
  <link rel="stylesheet" href="/css/pub/common.css">
  <style>
    .schedule-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-top: 24px; }
    .schedule-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 20px; transition: all 0.25s; border-top: 4px solid var(--primary-500); }
    .schedule-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .schedule-card .class-name { font-size: 17px; font-weight: 700; color: var(--gray-800); margin-bottom: 6px; }
    .schedule-card .grade { font-size: 12px; color: var(--gray-500); margin-bottom: 14px; }
    .schedule-card .subject-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--gray-50); border-radius: var(--radius-sm); margin-bottom: 8px; }
    .schedule-card .subject-name { font-weight: 600; color: var(--primary-700); flex: 1; }
    .schedule-card .semester { font-size: 12px; color: var(--gray-500); }
    .schedule-card .remark { margin-top: 10px; font-size: 13px; color: var(--gray-600); padding-top: 10px; border-top: 1px dashed var(--gray-200); }
    .empty { text-align: center; padding: 60px; color: var(--gray-400); }
    .empty svg { width: 80px; height: 80px; opacity: 0.3; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" data-active="schedule"></aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <h1 class="page-title">我的课表</h1>
          <p class="page-subtitle">查看管理员为您安排的授课任务</p>
        </div>
        <div class="header-right" id="headerUser">
          <!-- 由 common.js renderHeaderUser() 动态填充 -->
        </div>
      </header>

      <div class="content-area">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon primary">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div class="stat-value" id="totalClasses">--</div>
            <div class="stat-label">授课班级数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon success">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="stat-value" id="totalCourses">--</div>
            <div class="stat-label">授课科目数</div>
          </div>

        </div>

        <div class="schedule-list" id="scheduleList">
          <div class="empty">
            <p>加载中...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/pub/common.js"></script>
  <script>
    let allSchedules = [];
    let classStudentMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireLogin()) return;
      initPageUI('schedule');
      await loadSchedule();
    });

    async function loadSchedule() {
      try {
        const res = await apiRequest('/teaching-assignments/teacher/me');
        allSchedules = res.data || [];
        renderSchedule();
        renderStats();
      } catch (e) {
        document.getElementById('scheduleList').innerHTML = `
          <div class="empty" style="grid-column: 1/-1;">
            <p>暂无授课安排，请联系管理员</p>
          </div>`;
      }
    }

    function renderStats() {
      const classes = new Set(allSchedules.map(s => s.classId));
      const subjects = new Set(allSchedules.map(s => s.subject));
      document.getElementById('totalClasses').textContent = classes.size;
      document.getElementById('totalCourses').textContent = subjects.size;
    }

    function renderSchedule() {
      if (allSchedules.length === 0) {
        document.getElementById('scheduleList').innerHTML = `
          <div class="empty" style="grid-column: 1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <p>暂无授课安排，请联系管理员</p>
          </div>`;
        return;
      }

      // 按班级分组
      const grouped = {};
      allSchedules.forEach(s => {
        if (!grouped[s.classId]) grouped[s.classId] = { className: s.className, items: [] };
        grouped[s.classId].items.push(s);
      });

      const html = Object.values(grouped).map(group => `
        <div class="schedule-card">
          <div class="class-name">${escapeHtml(group.className)}</div>
          <div class="semester">${[...new Set(group.items.map(i => i.semester))].join(' / ')}</div>
          ${group.items.map(item => `
            <div class="subject-row">
              <span class="subject-name">${escapeHtml(item.subject)}</span>
            </div>
            ${item.remark ? `<div class="remark">备注：${escapeHtml(item.remark)}</div>` : ''}
          `).join('')}
        </div>
      `).join('');

      document.getElementById('scheduleList').innerHTML = html;
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
