<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生管理 - 学生成绩管理系统</title>
  <link rel="stylesheet" href="/css/pub/common.css">
  <style>
    .mobile-toggle {
      display: none;
      padding: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--gray-600);
    }
    .action-cell { display: flex; gap: 6px; }
    .avatar-sm { 
      width: 32px; height: 32px; border-radius: 50%; 
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: white;
    }
    .gender-male { background: #dbeafe; color: #2563eb; }
    .gender-female { background: #fce7f3; color: #db2777; }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" data-active="students"></aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="mobile-toggle" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="page-title">学生管理</h1>
            <p class="page-subtitle">管理学生信息的增删改查</p>
          </div>
        </div>
        <div class="header-right" id="headerUser">
          <!-- 由 common.js renderHeaderUser() 动态填充 -->
        </div>
      </header>

      <div class="content-area">
        <!-- 统计卡片 -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon primary">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            </div>
            <div class="stat-value" id="totalCount">--</div>
            <div class="stat-label">学生总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon success">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            </div>
            <div class="stat-value" id="maleCount">--</div>
            <div class="stat-label">男生人数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon warning">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </div>
            <div class="stat-value" id="femaleCount">--</div>
            <div class="stat-label">女生人数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon danger">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
            </div>
            <div class="stat-value" id="classCount">--</div>
            <div class="stat-label">班级数量</div>
          </div>
        </div>

        <!-- 数据卡片 -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">学生列表</h3>
            <div class="toolbar">
              <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="搜索学号、姓名..." oninput="debouncedSearch()">
              </div>
              <select id="classFilter" class="filter-select" onchange="loadStudents()">
                <option value="">全部班级</option>
              </select>
              <select id="genderFilter" class="filter-select" onchange="loadStudents()">
                <option value="">全部性别</option>
                <option value="男">男生</option>
                <option value="女">女生</option>
              </select>
              <button class="btn btn-primary btn-sm" data-require-role="admin" onclick="openModal('addStudentModal')">
                + 添加学生
              </button>
            </div>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>性别</th>
                    <th>所属班级</th>
                    <th>入学日期</th>
                    <th>联系电话</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="studentTableBody">
                  <!-- 动态加载 -->
                </tbody>
              </table>
            </div>
            <div id="emptyState" class="empty-state" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <h3>暂无学生数据</h3>
              <p>点击右上角按钮添加第一位学生</p>
            </div>
            <div style="padding: 0 24px;">
              <div class="pagination" id="pagination"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 添加/编辑学生弹窗 -->
  <div class="modal-overlay" id="addStudentModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="studentModalTitle">添加学生</h3>
        <button class="modal-close" onclick="closeModal('addStudentModal')">&times;</button>
      </div>
      <form id="studentForm" onsubmit="saveStudent(event)">
        <div class="modal-body">
          <input type="hidden" id="studentId">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">学号 *</label>
              <input type="text" id="studentNo" class="form-input" placeholder="例：2024001" required>
            </div>
            <div class="form-group">
              <label class="form-label">姓名 *</label>
              <input type="text" id="studentName" class="form-input" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
              <label class="form-label">性别 *</label>
              <select id="studentGender" class="form-select" required>
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">班级 *</label>
              <select id="studentClass" class="form-select" required>
                <option value="">请选择班级</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">入学日期</label>
              <input type="date" id="enrollDate" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">联系电话</label>
              <input type="tel" id="phone" class="form-input" placeholder="请输入手机号">
            </div>
            <div class="form-group" style="grid-column: 1/-1;">
              <label class="form-label">家庭住址</label>
              <input type="text" id="address" class="form-input" placeholder="请输入地址（选填）">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('addStudentModal')">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/pub/common.js"></script>
  <script>
    let currentPage = 1;
    const pageSize = 10;
    let searchTimer = null;
    let readOnly = false;  // 教师视角：只读模式

    // 页面加载初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 渲染公共 UI（侧边栏 / 用户信息）
      const user = requireLogin();
      if (!user) return;
      const isAdmin = user.role === 'admin';
      initPageUI('students');
      if (!isAdmin) {
        readOnly = true;
        // 教师视角：隐藏新增/编辑/删除按钮，禁用所有输入
        document.querySelectorAll('[data-require-role="admin"]').forEach(el => el.style.display = 'none');
        const titleEl = document.getElementById('pageSubtitle');
        if (titleEl) titleEl.textContent = '查看学生基本信息（只读）';
      }
      loadClasses();
      loadStudents();
      loadStats();
    });

    // 防抖搜索
    function debouncedSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadStudents(), 350);
    }

    // 加载班级下拉选项
    async function loadClasses() {
      try {
        const res = await apiRequest('/classes/list');
        const select = document.getElementById('studentClass');
        const filterSelect = document.getElementById('classFilter');
        
        select.innerHTML = '<option value="">请选择班级</option>';
        filterSelect.innerHTML = '<option value="">全部班级</option>';

        res.data.forEach(cls => {
          select.innerHTML += `<option value="${cls.id}">${cls.className} (${cls.grade})</option>`;
          filterSelect.innerHTML += `<option value="${cls.id}">${cls.className}</option>`;
        });
      } catch(e) {}
    }

    // 加载统计数据
    async function loadStats() {
      try {
        const res = await apiRequest('/students/stats');
        document.getElementById('totalCount').textContent = res.data.total || 0;
        document.getElementById('maleCount').textContent = res.data.maleCount || 0;
        document.getElementById('femaleCount').textContent = res.data.femaleCount || 0;
        document.getElementById('classCount').textContent = res.data.classCount || 0;
      } catch(e) {}
    }

    // 加载学生列表
    async function loadStudents() {
      const keyword = document.getElementById('searchInput').value.trim();
      const classId = document.getElementById('classFilter').value;
      const gender = document.getElementById('genderFilter').value;

      const params = new URLSearchParams({
        page: currentPage,
        pageSize,
        ...(keyword && { keyword }),
        ...(classId && { classId }),
        ...(gender && { gender })
      });

      try {
        const res = await apiRequest(`/students?${params}`);
        renderTable(res.data.list);
        renderPagination(res.data.totalPages);
        loadStats(); // 刷新统计
      } catch(e) {
        renderTable([]);
      }
    }

    // 渲染表格
    function renderTable(list) {
      const tbody = document.getElementById('studentTableBody');
      const emptyState = document.getElementById('emptyState');

      if (!list.length) {
        tbody.innerHTML = '';
        emptyState.style.display = '';
        return;
      }

      emptyState.style.display = 'none';
      tbody.innerHTML = list.map(s => `
        <tr>
          <td><strong>${s.studentNo}</strong></td>
          <td>
            <span class="avatar-sm ${s.gender === '男' ? 'gender-male' : 'gender-female'}">${s.name.charAt(0)}</span>
            ${s.name}
          </td>
          <td><span class="badge ${s.gender === '男' ? 'badge-primary' : 'badge-success'}">${s.gender}</span></td>
          <td>${s.className || '-'}</td>
          <td>${formatDate(s.enrollDate)}</td>
          <td>${s.phone || '-'}</td>
          <td><span class="badge badge-success">在读</span></td>
          <td class="action-cell">
            <button class="btn btn-outline btn-sm" data-require-role="admin" onclick="editStudent(${JSON.stringify(s).replace(/"/g,'&quot;')})">编辑</button>
            <button class="btn btn-danger btn-sm" data-require-role="admin" onclick="deleteStudent(${s.id}, '${s.name}')">删除</button>
          </td>
        </tr>
      `).join('');
    }

    // 渲染分页
    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = `
        <div class="pagination-info">第 ${currentPage} / ${totalPages} 页，共 ${totalPages * pageSize} 条</div>
        <div class="pagination-btns">
          <button ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>
      `;
      for(let i=1; i<=totalPages; i++) {
        html += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `
          <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>
        </div>
      `;
      document.getElementById('pagination').innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      loadStudents();
    }

    // 添加/保存学生
    function saveStudent(e) {
      e.preventDefault();
      if (readOnly) { showToast('您没有保存权限', 'warning'); return; }
      const id = document.getElementById('studentId').value;
      const data = {
        studentNo: document.getElementById('studentNo').value.trim(),
        name: document.getElementById('studentName').value.trim(),
        gender: document.getElementById('studentGender').value,
        classId: parseInt(document.getElementById('studentClass').value),
        enrollDate: document.getElementById('enrollDate').value,
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim()
      };

      const url = id ? `/students/${id}` : '/students';
      const method = id ? 'PUT' : 'POST';

      apiRequest(url, { method, body: JSON.stringify(data) })
        .then(() => {
          showToast(id ? '更新成功！' : '添加成功！');
          closeModal('addStudentModal');
          document.getElementById('studentForm').reset();
          document.getElementById('studentId').value = '';
          loadStudents();
        })
        .catch(() => {});
    }

    // 编辑学生
    function editStudent(s) {
      if (readOnly) { showToast('您没有编辑权限', 'warning'); return; }
      document.getElementById('studentModalTitle').textContent = '编辑学生';
      document.getElementById('studentId').value = s.id;
      document.getElementById('studentNo').value = s.studentNo;
      document.getElementById('studentName').value = s.name;
      document.getElementById('studentGender').value = s.gender;
      document.getElementById('studentClass').value = s.classId;
      document.getElementById('enrollDate').value = s.enrollDate || '';
      document.getElementById('phone').value = s.phone || '';
      document.getElementById('address').value = s.address || '';
      openModal('addStudentModal');
    }

    // 删除学生
    function deleteStudent(id, name) {
      if (readOnly) { showToast('您没有删除权限', 'warning'); return; }
      showConfirm(`确定要删除学生「${name}」吗？此操作不可恢复。`, () => {
        apiRequest(`/students/${id}`, { method: 'DELETE' })
          .then(() => {
            showToast('删除成功');
            loadStudents();
          })
          .catch(() => {});
      });
    }

    // 退出登录
    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userInfo');
      window.location.href = '/html/pub/login/login.html';
    }
  </script>
</body>
</html>
